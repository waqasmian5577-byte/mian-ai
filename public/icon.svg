<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060b"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>
    <linearGradient id="pwa-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="pwa-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with squircle safe padding -->
  <rect width="512" height="512" rx="110" fill="url(#pwa-bg)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#pwa-glow)" stroke-width="8" stroke-dasharray="16 10" fill="none" opacity="0.6"/>
  <circle cx="256" cy="256" r="130" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.4"/>

  <!-- Core Diamond & 'M' Emblem for Mian's AI -->
  <g filter="url(#pwa-blur)">
    <!-- Central Hexagonal AI core -->
    <polygon points="256,150 330,195 330,285 256,330 182,285 182,195" fill="#0b1120" stroke="url(#pwa-glow)" stroke-width="6"/>
    
    <!-- Stylized 'M' Glyph -->
    <path d="M 210,270 L 210,210 L 256,252 L 302,210 L 302,270" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Sparkle -->
    <circle cx="256" cy="256" r="6" fill="#38bdf8"/>
    <path d="M256,242 L258,254 L270,256 L258,258 L256,270 L254,258 L242,256 L254,254 Z" fill="#38bdf8"/>
  </g>

  <!-- Typography subtitle -->
  <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="4">MIAN'S AI</text>
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#38bdf8" letter-spacing="3">OMNIVERSE</text>
</svg>
